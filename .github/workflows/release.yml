name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: linux-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: macos-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: cargo build --release
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package tarball
        run: |
          tag="${GITHUB_REF_NAME}"
          staging="dist/${tag}"
          mkdir -p "${staging}"
          cp "target/${{ matrix.target }}/release/kotonoha" "${staging}/kotonoha"
          chmod +x "${staging}/kotonoha"
          tar -czf "kotonoha-${tag}-${{ matrix.asset }}.tar.gz" -C "${staging}" kotonoha

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: kotonoha-${{ github.ref_name }}-${{ matrix.asset }}.tar.gz
          generate_release_notes: true
