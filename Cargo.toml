[package]
name = "kotonoha-cli"
version = "0.1.5"
edition = "2021"
description = "Official Kotonoha CLI — validate RDE interchange against kotonoha-spec"
license = "Apache-2.0"
repository = "https://github.com/zyx-corporation/kotonoha-cli"
rust-version = "1.74"

[[bin]]
name = "kotonoha"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
kotonoha_core = { git = "https://github.com/zyx-corporation/kotonoha-core.git", tag = "v0.1.4", features = ["postgres"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
