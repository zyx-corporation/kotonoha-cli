[package]
name = "kotonoha-cli"
version = "0.2.5"
edition = "2021"
description = "Official Kotonoha CLI — validate RDE interchange against kotonoha-spec"
license = "Apache-2.0"
repository = "https://github.com/zyx-corporation/kotonoha-cli"
rust-version = "1.74"

[[bin]]
name = "kotonoha"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
kotonoha_core = { git = "https://github.com/zyx-corporation/kotonoha-core.git", rev = "cab8af504970d9c1529642b04223eb04d840ef81", features = ["postgres"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
